<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | Work Management</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>

    <div class="landscape-scene page-landscape" aria-hidden="true">
      <img class="scene-land scene-day" src="images/background-day.svg" alt="" />
      <img class="scene-land scene-night" src="images/background-night.svg" alt="" />
    </div>

    <main class="login-card" aria-labelledby="login-title">

      <section class="scene-panel" aria-labelledby="welcome-title">
        <div class="landscape-scene" aria-hidden="true">
          <div class="scene-sky-objects">
            <div class="scene-sun"></div>
            <div class="scene-moon"></div>
          </div>
          <img class="scene-land scene-day" src="images/panel-day.svg" alt="" />
          <img class="scene-land scene-night" src="images/panel-night.svg" alt="" />
        </div>
        <div class="scene-copy">
          <h2 id="welcome-title">Your Workspace</h2>
          <p>Sign in to manage tasks, track project progress, and collaborate with your team.</p>
        </div>
      </section>

      <section class="form-panel">
        <form class="login-form" id="login-form">
          
          <h1 id="login-title">Sign in</h1>

          <div class="field">
            <label class="sr-only" for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Email" autocomplete="username" required />

            <!--owl-->
            <div class="email-owl" id="email-owl" aria-hidden="true">
              <div class="owl-art">
                <img src="images/owl-perch.svg" alt="" />
                <div class="owl-breath">
                  <img src="images/owl-body.svg" alt="" />
                  <div class="owl-head">
                    <img src="images/owl-head.svg" alt="" />
                    <div class="owl-eyes">
                      <img src="images/owl-eyes.svg" alt="" />
                      <div class="owl-gaze"><img src="images/owl-gaze.svg" alt="" /></div>
                    </div>
                  </div>
                </div>
              </div>    
            </div>
            <!--end owl-->
            
          </div>

          <div class="field password">
            <label class="sr-only" for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
            <button class="eye" id="show-password" type="button" aria-label="Show password with flashlight" aria-pressed="false" aria-controls="password">
              <img src="images/icon-eye.svg" alt="" width="18" height="18" />
            </button>
          </div>

          <button class="text-action forgot" id="forgot-password" type="button">Forgot password?</button>
          <button class="submit" type="submit">Sign in <img src="images/icon-arrow.svg" alt="" width="17" height="17" /></button>
          <p class="signup-row">Don't have an account? <button class="text-action" id="signup" type="button">Sign up</button></p>
          <p class="status" id="status" role="status" aria-live="polite"></p>

        </form>
      </section>

    </main>

    <div class="flash-beam" id="flash-beam" aria-hidden="true"></div>
    <div class="password-reveal" id="password-reveal" aria-hidden="true"><span id="reveal-text"></span></div>
    <div class="flashlight" id="flashlight" aria-hidden="true"><img src="images/flashlight.svg" alt="" width="33" height="33" /></div>
  
  </body>

</html>
